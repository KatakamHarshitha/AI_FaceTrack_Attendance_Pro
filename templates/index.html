<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FaceTrack Attendance Pro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI FaceTrack Attendance Pro</h1>
        <p>Smart Attendance System</p>

        <div class="card">

            <h2>Add New User</h2>

            <input
                type="text"
                id="name"
                placeholder="Enter name"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter email"
            >

            <button onclick="addUser()">
                Register User
            </button>

            <p id="message"></p>

        </div>


        <div class="buttons">

            <button onclick="loadUsers()">
                View Users
            </button>

            <button onclick="loadAttendance()">
                View Attendance
            </button>
            <button onclick="capturePhotos()">
                Capture Photos
            </button>
            <button onclick="trainModel()">
                Train Model
            </button>
        </div>


        <div class="card">

            <h2>Users</h2>

            <table id="usersTable">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>


        <div class="card">

            <h2>Attendance</h2>

            <table id="attendanceTable">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User ID</th>
                        <th>Date</th>
                        <th>Time</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

    </div>


    <script>

        async function addUser() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            const response = await fetch("/api/users", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email
                })

            });

            const data = await response.json();

            document.getElementById("message").innerText =
                data.message || data.error;

            if (response.ok) {
                document.getElementById("name").value = "";
                document.getElementById("email").value = "";
                window.currentUserId = data.id;
                document.getElementById("message").innerText ="User registered successfully. User ID: " + data.id;
            }
        }


        async function loadUsers() {

            const response = await fetch("/api/users");

            const users = await response.json();

            const tableBody =
                document.querySelector("#usersTable tbody");

            tableBody.innerHTML = "";

            users.forEach(user => {

                tableBody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                    </tr>
                `;

            });
        }


        async function loadAttendance() {

            const response = await fetch("/api/attendance");

            const records = await response.json();

            const tableBody =
                document.querySelector("#attendanceTable tbody");

            tableBody.innerHTML = "";

            records.forEach(record => {

                tableBody.innerHTML += `
                    <tr>
                        <td>${record.id}</td>
                        <td>${record.user_id}</td>
                        <td>${record.date}</td>
                        <td>${record.time}</td>
                    </tr>
                `;

            });
        }
        async function capturePhotos() {

            if (!window.currentUserId) {
                alert("Please register a user first.");
                return;
            }

            const response = await fetch(
                `/api/capture/${window.currentUserId}`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            alert(data.message);
        }
        async function trainModel() {

            const response = await fetch("/api/train", {
                method: "POST"
            });

            const data = await response.json();

            alert(data.message);
        }
    </script>

</body>
</html>
